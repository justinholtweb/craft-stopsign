<!--
  The control panel nav tints a mask, so this is one path in one colour with the bar knocked out
  by the even-odd rule rather than painted white over the top. Painted white, the bar disappears
  the moment Craft recolours the mark — which it does on hover, and again in dark mode.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Stop Sign">
    <path fill-rule="evenodd" d="M29.29,0 L70.71,0 L100,29.29 L100,70.71 L70.71,100 L29.29,100 L0,70.71 L0,29.29 Z M26,43.5 L74,43.5 L74,56.5 L26,56.5 Z"/>
</svg>
