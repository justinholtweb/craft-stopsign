<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Control panel nav icon: the mark alone, no tile, inheriting Craft's own colour. One path with
    the bar knocked out by the even-odd rule rather than painted white over the top — the control
    panel tints a mask, so a painted bar disappears the moment Craft recolours the mark, which it
    does on hover and again in dark mode.
  -->
  <path fill-rule="evenodd" d="M36.75,18 L63.25,18 L82,36.75 L82,63.25 L63.25,82 L36.75,82 L18,63.25 L18,36.75 Z M34,44.5 H66 A2,2 0 0 1 68,46.5 V53.5 A2,2 0 0 1 66,55.5 H34 A2,2 0 0 1 32,53.5 V46.5 A2,2 0 0 1 34,44.5 Z"/>
</svg>
