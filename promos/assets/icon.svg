<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The mark is a regular octagon and one bar. Nothing else survives 18px, which is where a control
  panel icon is actually judged — a raised hand or the word STOP is a smudge at nav size, whereas
  the shape of a stop sign is legible on its own and the bar keeps it from reading as a plain
  polygon. The bar is knocked out with the even-odd rule, so the tile shows through it and the
  mark is the same single path as icon-mask.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Stop Sign">
  <rect width="100" height="100" rx="22.44" fill="#C8102E"/>
  <path fill="#FEFEFE" fill-rule="evenodd" d="M36.75,18 L63.25,18 L82,36.75 L82,63.25 L63.25,82 L36.75,82 L18,63.25 L18,36.75 Z M34,44.5 H66 A2,2 0 0 1 68,46.5 V53.5 A2,2 0 0 1 66,55.5 H34 A2,2 0 0 1 32,53.5 V46.5 A2,2 0 0 1 34,44.5 Z"/>
</svg>
